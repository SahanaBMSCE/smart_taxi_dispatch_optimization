name: Smart Taxi Dispatch MLOps Pipeline

on:
  push:
    branches:
      - main
      - dev
      - feature/*
  pull_request:
    branches:
      - main
      - dev

jobs:

  build-and-test:

    runs-on: ubuntu-latest

    steps:

      # Checkout Repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Setup Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Install Dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Verify FastAPI Import
      - name: Verify FastAPI import
        run: |
          python -c "from api.app import app"

      # Verify PPO Import
      - name: Verify PPO Agent
        run: |
          python -c "from sim.ppo_agent import train_ppo"

      # Verify Q-Learning Script
      - name: Verify Q-Learning Script
        run: |
          python -c "from experiments.train import train"

      # Verify DVC Installation
      - name: Verify DVC
        run: |
          pip install dvc
          dvc version

      # Build Docker Image
      - name: Build Docker Image
        run: |
          docker build -t smart-taxi-api .